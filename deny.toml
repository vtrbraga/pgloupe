[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates that are never published depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
