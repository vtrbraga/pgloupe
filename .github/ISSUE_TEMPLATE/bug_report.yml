name: Bug report
description: Something gave a wrong number, a crash, or an empty report.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: pgloupe version
      description: Output of `pgloupe --version`.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where do the logs come from?
      options: [Self-managed, Amazon RDS / Aurora, Google Cloud SQL, Azure, Aiven, Heroku, Other]
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version and log format
      placeholder: "16, stderr with log_line_prefix '%m [%p] %q%u@%d '"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and the lines that show it
      description: |
        The command you ran, and a few log lines that reproduce it. Replace names and values;
        `pgloupe logs analyze --anonymize` rewrites them for you. Do not paste customer data.
      render: shell
