name: Publish to crates.io

# Called by the release workflow after the GitHub Release exists.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libclang (pg_query's bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish -p pgloupe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
