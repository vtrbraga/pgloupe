name: Docker image

# Called by the release workflow after the GitHub Release is announced.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: build and push to ghcr.io
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      PRERELEASE: ${{ fromJson(inputs.plan).announcement_is_prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Take the Linux binaries from the release
        run: |
          mkdir -p ctx/amd64 ctx/arm64 dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern 'pgloupe-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'pgloupe-aarch64-unknown-linux-gnu.tar.gz'
          tar -xzf dl/pgloupe-x86_64-unknown-linux-gnu.tar.gz -C ctx/amd64 --strip-components=1 --wildcards '*/pgloupe'
          tar -xzf dl/pgloupe-aarch64-unknown-linux-gnu.tar.gz -C ctx/arm64 --strip-components=1 --wildcards '*/pgloupe'
          chmod +x ctx/amd64/pgloupe ctx/arm64/pgloupe
      - id: names
        run: |
          version="${TAG#v}"
          tags="ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
          if [ "$PRERELEASE" != "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          build-args: VERSION=${{ steps.names.outputs.version }}
